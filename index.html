<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>20261027 AI교육</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1f2328; --muted: #6b7280; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181d; --fg: #e6e8eb; --muted: #9aa1ab; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--fg);
      font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    }
    main { max-width: 560px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 5vw, 2.4rem); }
    p { margin: 0 0 8px; color: var(--muted); line-height: 1.6; }
    .badge { display: inline-block; margin-bottom: 16px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="badge">한국몰드 · 2026.10.27</div>
    <h1>AI 교육 실습 페이지</h1>
    <p>GitHub에 푸시하면 Vercel이 자동으로 배포합니다.</p>
  </main>
</body>
</html>
